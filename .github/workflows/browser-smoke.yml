name: Feuch Lab browser smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser smoke on mobile viewport
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/feuch-vite.log 2>&1 &
          node scripts/browser-smoke.mjs
